<script>

const ONLINE=window.SMIT_SERVER===true, KEY='smit-agenda-preview-v2';

const icon=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.content}"/></svg>`;
const routes={today:'Hoje',content:'Conteúdo',calendar:'Calendário',metrics:'Métricas',accounts:'Contas',assistant:'Assistente'};

function postJobs(p){return (DATA.jobs||[]).filter(j=>j.post_id===p.id&&j.version===p.version);}
function postState(p){const jobs=postJobs(p).filter(j=>j.status!=='cancelled');if(!jobs.length)return p.status;if(jobs.some(j=>j.status==='unknown'))return 'unknown';if(jobs.every(j=>j.status==='published'))return 'published';if(jobs.every(j=>j.status==='failed'))return 'failed';if(jobs.some(j=>j.status==='failed'))return 'partial';if(jobs.some(j=>['claimed','sending','confirming'].includes(j.status)))return 'processing';return 'scheduled';}
const channels={instagram:'Instagram',facebook_page:'Facebook',linkedin:'LinkedIn',youtube:'YouTube'};
const metricNames={reach:'Alcance',views:'Visualizações',accounts_engaged:'Contas engajadas',total_interactions:'Interações',followers_count:'Seguidores atuais',media_count:'Publicações atuais',fan_count:'Curtidas atuais',page_media_view:'Visualizações de conteúdo',page_total_media_view_unique:'Visualizadores únicos no dia',page_post_engagements:'Interações com conteúdo',page_daily_follows:'Novos seguidores no dia'};
let DATA={brand:{name:'SMIT',guidelines:''},posts:[],accounts:[],reports:[],jobs:[],media:[]}, ME=null, route='today', search='', statusFilter='', month=new Date(), toastTimer, oauthTimer, oauthStop=null;
const temporaryMedia=new Map();let assistantPrompt='';
function spParts(d=new Date()){return Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));}
function spNow(){const p=spParts();return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;}
function dayKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function period(days=7){const p=spParts(),end=new Date(Date.UTC(+p.year,+p.month-1,+p.day-1)),start=new Date(end);start.setUTCDate(start.getUTCDate()-days+1);return {start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10)};}
const fmt=t=>t?new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'short'}).format(new Date(typeof t==='number'?t*1000:t)):'Ainda não verificado';
const num=v=>v===null||v===undefined?'—':new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(v);
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
function previewSave(){if(ONLINE)return;try{localStorage.setItem(KEY,JSON.stringify({brand:DATA.brand,posts:DATA.posts}));}catch{toast('O navegador não permitiu guardar os rascunhos. Use Salvar cópia antes de fechar.');}}
function loadPreview(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.brand&&Array.isArray(x.posts)){DATA.brand={name:String(x.brand.name||'SMIT'),guidelines:String(x.brand.guidelines||'')};DATA.posts=x.posts.filter(p=>p&&typeof p.id==='string'&&Number.isInteger(p.version)&&p.version>0&&Object.hasOwn(stages,p.status)).slice(0,500);}}catch{} }
async function api(path,{method='GET',body}={}){if(!ONLINE)throw Error('A conexão real será feita na instalação online da SMIT.');const c=new AbortController(),timer=setTimeout(()=>c.abort(),90000);try{const response=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json',...(ME?.csrf?{'X-CSRF-Token':ME.csrf}:{})},body:body===undefined?undefined:JSON.stringify(body),signal:c.signal});let data;try{data=await response.json();}catch{throw Error('O servidor não retornou uma resposta válida.');}if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Não foi possível concluir esta ação.');return data;}catch(e){if(e.name==='AbortError')throw Error('O servidor ainda não confirmou a resposta. Atualize a tela antes de repetir.');throw e;}finally{clearTimeout(timer);}}
async function action(fn,button){if(button)button.disabled=true;try{return await fn();}catch(e){toast(e.message||'Não foi possível concluir.');}finally{if(button)button.disabled=false;}}
async function refresh(){if(ONLINE){DATA=await api('/workspace');}render();}
function modal(title,body,foot=''){if(oauthStop){oauthStop();oauthStop=null;}$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-foot').innerHTML=foot?`<div class="dialog-foot">${foot}</div>`:'';if(!$('#modal').open)$('#modal').showModal();}

const connectionProviders=[{key:'meta',channel:'instagram',title:'Instagram profissional',subtitle:'Meta · perfil profissional',button:'Conectar Instagram',icon:'IG'},{key:'meta',channel:'facebook_page',title:'Facebook',subtitle:'Meta · página oficial',button:'Conectar Página',icon:'f'},{key:'google',channel:'youtube',title:'YouTube',subtitle:'Google · canal da equipe',button:'Conectar YouTube',icon:'▶'},{key:'linkedin',channel:'linkedin',title:'LinkedIn',subtitle:'Página da organização',button:'Conectar LinkedIn',icon:'in'}];
const channelIcon=channel=>connectionProviders.find(p=>p.channel===channel)?.icon||'+';
function connectionHelp(provider){const steps={meta:['Aplicativo Meta com Facebook Login for Business.','Retorno HTTPS e credenciais protegidas no servidor.'],google:['Aceitar os termos do Google Cloud na conta da equipe.','Criar projeto e ativar YouTube Data API v3 e YouTube Analytics API.','Configurar a tela de consentimento, os usuários de teste e um cliente OAuth do tipo Aplicativo da Web.','Cadastrar o retorno HTTPS e salvar o ID e o segredo do cliente nas variáveis protegidas do Netlify.'],linkedin:['Entrar com o perfil que administra a página da SMIT.','Cadastrar um aplicativo vinculado à página e obter acesso à Community Management API.','Cadastrar o retorno HTTPS e salvar ID, segredo, versão da API e escopos aprovados no servidor.']};modal('Preparar conexão · '+({meta:'Meta',google:'YouTube',linkedin:'LinkedIn'}[provider]),`<ol class="steps">${steps[provider].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="notice">O login no provedor é uma etapa separada da configuração do aplicativo. A conta só aparece como conectada depois da autorização, seleção e verificação na API.</p><p class="muted micro">Retorno: <code>${esc(location.origin+'/api/oauth/'+provider+'/callback')}</code></p>`);}
function renderAccounts(){const providers=DATA.connections||{};$('#view').innerHTML=intro('Contas','As contas da equipe, em um lugar.','Confira as conexões e autorize os perfis oficiais. Tokens ficam protegidos no servidor.','<button id="resume-oauth">Retomar autorização</button>')+`<div class="grid four">${connectionProviders.map(p=>{const connected=DATA.accounts.filter(a=>a.channel===p.channel).length,ready=ONLINE&&providers[p.key];return `<section class="card account-card"><div class="account-head"><span class="network-icon ${p.channel}">${p.icon}</span><div><h3>${p.title}</h3><p class="muted">${p.subtitle}</p></div></div><span class="pill ${connected?'approved':'draft'}">${connected?connected+' conta(s) conectada(s)':ready?'Pronto para autorizar':'Configuração pendente'}</span><p class="muted micro">${p.key==='linkedin'?'A integração de Páginas exige acesso aprovado pelo LinkedIn.':p.key==='google'?'Escolha a conta Google ou conta de marca que possui o canal.':'Selecione somente os ativos oficiais da equipe.'}</p><div class="actions"><button class="${ready?'primary':''} connect-provider" data-provider="${p.key}">${ready?p.button:'Ver configuração'}</button></div></section>`;}).join('')}</div><div class="section-title"><h3>Contas confirmadas</h3><span class="muted micro">${DATA.accounts.length} nesta instalação</span></div><div class="grid three">${DATA.accounts.map(a=>`<article class="card account-card"><div class="account-head"><span class="network-icon ${esc(a.channel)}">${channelIcon(a.channel)}</span><div><h3>${esc(a.name)}</h3><p>${esc(a.handle||a.remote_id)}</p></div></div><span class="pill ${a.verified?'approved':'review'}">${a.verified?'Identidade verificada':'Rever acesso'}</span><p class="muted micro">${esc(channels[a.channel])}<br>${a.insights?'Métricas ficam para a próxima etapa':'Métricas ficam para a próxima etapa'}<br>${a.publishing_enabled?'Pronta para agendar':'Permissão de publicação pendente · reconecte'}</p><p class="muted micro">Verificado em ${fmt(a.verified_at)}</p><button class="small verify-account" data-id="${esc(a.id)}">Verificar acesso</button></article>`).join('')||`<div class="card" style="grid-column:1/-1">${empty('Conecte o primeiro perfil','Depois da autorização oficial, selecione as contas que deseja vincular.','accounts')}</div>`}</div><p class="notice" style="margin-top:20px">Conectar uma conta não publica conteúdo. A fila só é criada quando você escolhe as contas, confere a data e clica em Agendar publicação.</p>`;$('#resume-oauth').onclick=()=>checkPending();$$('.connect-provider').forEach(b=>b.onclick=()=>providers[b.dataset.provider]?connectProvider(b.dataset.provider,b):connectionHelp(b.dataset.provider));$$('.verify-account').forEach(b=>b.onclick=()=>action(async()=>{await api('/accounts/'+encodeURIComponent(b.dataset.id)+'/verify',{method:'POST',body:{}});await refresh();toast('Identidade conferida no provedor.');},b));}
async function connectProvider(provider,button){if(!ONLINE){connectionHelp(provider);return;}await action(async()=>{const result=await api('/oauth/'+provider+'/start',{method:'POST',body:{}}),url=new URL(result.url),origins={meta:'https://www.facebook.com',google:'https://accounts.google.com',linkedin:'https://www.linkedin.com'};if(url.origin!==origins[provider])throw Error('Endereço de autorização inválido.');location.assign(url.href);},button);}
function connectMeta(){return connectProvider('meta');}
function showAssets(pending){modal('Confira as contas da SMIT',`<p>Selecione somente os ativos que esta instalação deve acessar. Nada vem selecionado por padrão.</p>${(pending.warnings||[]).map(w=>`<p class="notice">${esc(w)}</p>`).join('')}<form id="select-assets">${pending.assets.map(a=>`<label class="check"><input type="checkbox" name="asset" value="${esc(a.key)}"><span><strong>${esc(a.name)}</strong><br>${esc(channels[a.channel])} · ${esc(a.handle||a.remote_id)} · ID ${esc(a.remote_id)}</span></label>`).join('')||'<p class="notice">A Meta não retornou ativos compatíveis. Confira o perfil usado, as permissões e o vínculo profissional.</p>'}<button class="primary" ${pending.assets.length?'':'disabled'}>Confirmar contas selecionadas</button></form>`);$('#select-assets').onsubmit=e=>{e.preventDefault();action(async()=>{const keys=$$('input[name="asset"]:checked',e.target).map(x=>x.value);if(!keys.length)throw Error('Escolha pelo menos um ativo.');await api('/oauth/'+(['meta','google','linkedin'].includes(pending.provider)?pending.provider:'meta')+'/select',{method:'POST',body:{attempt_id:pending.id,keys}});$('#modal').close();await refresh();toast('Contas verificadas e vinculadas à SMIT.');});};}
async function checkPending(){if(!ONLINE)return;await action(async()=>{const rows=await api('/oauth/pending');if(rows.length)showAssets(rows[0]);});}
function renderMetrics(){const dates=period(),options=DATA.accounts.map(a=>`<option value="${esc(a.id)}">${esc(channels[a.channel]+' · '+(a.handle||a.name))}</option>`).join('');$('#view').innerHTML=intro('Métricas','Entenda antes de decidir.','Cada resultado mantém sua origem, período e cobertura. Sem conta conectada, os números ficam em branco.')+`<section class="card"><form id="metrics-filter" class="toolbar"><label class="field" style="flex:1;margin:0"><span>Conta</span><select name="account" required><option value="">Selecione a conta</option>${options}</select></label><label class="field" style="margin:0"><span>Início</span><input type="date" name="start" value="${dates.start}" required></label><label class="field" style="margin:0"><span>Fim</span><input type="date" name="end" value="${dates.end}" required max="${dates.end}"></label><button class="primary" id="collect-metrics" ${ONLINE&&DATA.accounts.length&&DATA.capabilities?.metrics_collection?'':'disabled'}>Buscar dados reais</button></form><p class="muted micro">A coleta é solicitada ao servidor. A coleta e a sincronização automática ainda não estão habilitadas nesta versão. Um período concluído sem valores não significa desempenho zero.</p></section><div class="section-title"><h3>Relatórios salvos</h3><span class="muted micro">${DATA.reports.length} leitura(s)</span></div><div id="metric-results" class="grid">${DATA.reports.length?DATA.reports.map(reportCard).join(''):`<div class="card">${empty('Os resultados entram por aqui','Conecte uma conta e busque um período. Não usamos números de exemplo.','metrics')}</div>`}</div>`;$('#metrics-filter').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/reports/collect',{method:'POST',body:{account_id:e.target.elements.account.value,start:e.target.elements.start.value,end:e.target.elements.end.value}});await refresh();toast('Leitura salva. Confira a cobertura e os avisos.');},$('#collect-metrics'));};$$('.csv-report').forEach(b=>b.onclick=()=>{const r=DATA.reports.find(x=>x.id===b.dataset.id);exportCSV('smit-metricas.csv',[['Conta','Início','Fim','Métrica','Valor','Granularidade','Data','Fonte','Fuso'],...(r.points||[]).map(p=>[r.account_name,r.start,r.end,p.metric,p.value,p.grain,p.date,r.source,r.timezone])]);});$$('.export-report').forEach(b=>b.onclick=()=>download('smit-relatorio-'+b.dataset.id+'.json',JSON.stringify(DATA.reports.find(r=>r.id===b.dataset.id),null,2),'application/json'));}
function reportCard(r){const points=r.points||[],periodPoints=points.filter(p=>p.grain==='account_period'),snapshots=points.filter(p=>p.grain==='account_snapshot'),daily=points.filter(p=>p.grain==='day');return `<article class="card"><div class="section-title" style="margin-top:0"><div><h3>${esc(r.account_name)} · ${esc(channels[r.channel])}</h3><p class="muted micro">${esc(r.start)} a ${esc(r.end)} · observado em ${fmt(r.observed_at)}</p></div><span class="pill ${r.partial?'review':'approved'}">${r.partial?'Cobertura parcial':'Leitura concluída'}</span></div>${periodPoints.length?`<div class="grid four">${periodPoints.map(p=>`<div><div class="metric-label">${esc(metricNames[p.metric]||p.metric)}</div><div class="metric-value">${num(p.value)}</div></div>`).join('')}</div>`:'<p class="muted">Sem totais nativos de período nesta leitura. Confira os saldos ou dados diários.</p>'}${snapshots.length?`<details><summary>Saldos observados agora</summary><div class="grid four">${snapshots.map(p=>`<div><span class="metric-label">${esc(metricNames[p.metric]||p.metric)}</span><div class="metric-value">${num(p.value)}</div></div>`).join('')}</div></details>`:''}${daily.length?`<details><summary>${daily.length} observações diárias</summary><p class="muted">Visualizadores únicos de dias diferentes não são pessoas únicas no período. Não somamos essas audiências.</p><div class="table-wrap"><table><thead><tr><th>Data</th><th>Métrica</th><th>Valor</th></tr></thead><tbody>${daily.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(metricNames[p.metric]||p.metric)}</td><td>${num(p.value)}</td></tr>`).join('')}</tbody></table></div></details>`:''}<details><summary>Fonte e cobertura</summary><p>Fuso da fonte: ${esc(r.timezone)}</p>${(r.warnings||[]).map(w=>`<p class="notice">${esc(w)}</p>`).join('')}<p class="muted micro">${esc(r.source)}</p></details><div class="actions" style="margin-top:17px"><button class="small csv-report" data-id="${esc(r.id)}">Exportar CSV</button><button class="small export-report" data-id="${esc(r.id)}">Exportar dados e fonte</button></div></article>`;}
function renderAssistant(){$('#view').innerHTML=intro('Assistente','A marca vem antes da legenda.','Prepare um briefing com contexto e leve ao Claude. A equipe revisa a resposta antes de usar.')+`<div class="grid two"><form class="card" id="assistant-form"><h3>O que vamos criar?</h3><label class="field"><span>Objetivo</span><select name="goal"><option>Explicar um assunto</option><option>Apresentar um trabalho</option><option>Convidar para uma ação</option><option>Reforçar posicionamento</option><option>Propor pautas para a semana</option></select></label><label class="field"><span>Rede principal</span><select name="channel"><option>Instagram</option><option>Facebook</option></select></label><label class="field"><span>Fatos e contexto do conteúdo</span><textarea name="brief" rows="7" required placeholder="O que aconteceu? O que podemos afirmar? Há nomes, datas ou créditos para preservar?"></textarea></label><button class="primary">Preparar briefing para o Claude</button><p class="muted micro">Este botão organiza um prompt. Não chama uma IA nem consome uma API paga.</p></form><section class="card"><h3>Briefing pronto para levar</h3><div class="assistant-output" id="assistant-output">${esc(assistantPrompt||'Seu briefing aparece aqui. Você decide o que compartilhar com a conta da SMIT no Claude.')}</div><div class="actions" style="margin-top:15px"><button id="copy-brief" ${assistantPrompt?'':'disabled'}>Copiar briefing</button><button class="small" id="brief-to-content">Criar rascunho</button></div><p class="muted micro">As orientações salvas ajudam no contexto. Isso não significa treinar ou atualizar o modelo automaticamente.</p></section></div>`;$('#assistant-form').onsubmit=e=>{e.preventDefault();const f=e.target;assistantPrompt=`Atue como assistente editorial da ${DATA.brand.name}.\n\nOBJETIVO: ${f.elements.goal.value}\nREDE: ${f.elements.channel.value}\n\nORIENTAÇÕES DA MARCA:\n${DATA.brand.guidelines||'Ainda não definidas. Use linguagem clara e pergunte apenas por fatos indispensáveis.'}\n\nBRIEFING CONFIRMADO:\n${f.elements.brief.value}\n\nENTREGA:\n1. Uma proposta de legenda e uma alternativa curta.\n2. Uma sugestão de abertura e CTA coerente com o objetivo.\n3. Cuidados factuais ou créditos que precisem de confirmação.\nNão invente resultados, pessoas, produtos ou campanhas. Sem base suficiente, trate recomendações como hipóteses. Não publique, não aprove e não agende.\n\nDADOS DISPONÍVEIS:\n${DATA.reports.length?JSON.stringify(DATA.reports.slice(0,2).map(r=>({conta:r.account_name,periodo:[r.start,r.end],fonte:r.source,parcial:r.partial,pontos:r.points,ressalvas:r.warnings})),null,2):'Nenhum relatório coletado. Não inventar melhores horários nem previsões.'}`;$('#assistant-output').textContent=assistantPrompt;$('#copy-brief').disabled=false;};$('#copy-brief').onclick=()=>copyText(assistantPrompt);$('#brief-to-content').onclick=()=>openEditor();}
function brandSettings(){modal('Orientações da SMIT',`<form id="brand-form"><label class="field"><span>Nome de exibição</span><input name="name" required maxlength="80" value="${esc(DATA.brand.name)}"></label><label class="field"><span>Tom de voz, público e cuidados</span><textarea name="guidelines" rows="10" maxlength="12000" placeholder="O que a marca defende? Como fala? O que não pode afirmar?">${esc(DATA.brand.guidelines)}</textarea></label><p class="muted micro">Não inclua senhas, tokens ou dados pessoais desnecessários. Estas orientações compõem o briefing apenas quando você o prepara.</p><button class="primary">Salvar orientações</button></form>`);$('#brand-form').onsubmit=e=>{e.preventDefault();action(async()=>{const body={name:e.target.elements.name.value.trim(),guidelines:e.target.elements.guidelines.value};if(!body.name)throw Error('Informe o nome de exibição.');if(ONLINE)await api('/brand',{method:'POST',body});else{DATA.brand=body;previewSave();}$('#modal').close();await refresh();toast('Orientações salvas.');});};}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Briefing copiado.');}catch{modal('Copiar briefing',`<label class="field"><span>Selecione e copie o texto</span><textarea id="copy-fallback" rows="16" readonly>${esc(value)}</textarea></label>`);$('#copy-fallback').select();}}
function loginScreen(){$('#logout').hidden=true;$('#new-post').disabled=true;$('#backup').disabled=true;$('#view').innerHTML=`<div class="login-wrap card"><span class="eyebrow">ASCOM · SMIT Agenda</span><h2>Entre na plataforma.</h2><p class="muted">Receba um link de acesso no e-mail autorizado da equipe.</p><form id="login-form"><label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label><button class="primary">Enviar link de acesso</button><p id="login-error" class="muted micro" role="status"></p></form><p class="notice">A conexão das redes sociais será feita separadamente, nas páginas oficiais.</p></div>`;$('#login-form').onsubmit=e=>{e.preventDefault();const button=e.target.querySelector('button');action(async()=>{try{await api('/login',{method:'POST',body:{email:e.target.elements.email.value}});$('#login-error').textContent='Abra o link recebido no e-mail neste navegador. Se não chegar, confira o spam e aguarde antes de pedir outro.';}catch(err){$('#login-error').textContent=err.message;}},button);};}
$('#logout').onclick=()=>action(async()=>{await api('/logout',{method:'POST',body:{}});ME=null;loginScreen();toast('Sessão encerrada.');});$('#new-post').onclick=()=>openEditor();$('#brand-settings').onclick=()=>ONLINE&&!ME?toast('Entre na plataforma primeiro.'):brandSettings();$('#backup').onclick=()=>{download('smit-social-lab-textos-e-relatorios.json',JSON.stringify({exported_at:new Date().toISOString(),mode:ONLINE?'server':'preview',brand:DATA.brand,posts:DATA.posts,accounts:DATA.accounts,reports:DATA.reports},null,2),'application/json');toast('Cópia sem credenciais. As mídias originais não estão incluídas.');};window.addEventListener('hashchange',render);
(async()=>{const connection=new URLSearchParams(location.search).get('connection');if(connection)history.replaceState(null,'',location.pathname+'#accounts');if(ONLINE&&location.hash.includes('access_token=')){const params=new URLSearchParams(location.hash.slice(1)),access_token=params.get('access_token');history.replaceState(null,'',location.pathname);try{ME=await api('/session',{method:'POST',body:{access_token}});$('#new-post').disabled=false;$('#backup').disabled=false;await refresh();return;}catch{loginScreen();toast('Link inválido ou expirado. Peça um novo acesso.');return;}}if(!ONLINE){loadPreview();render();return;}try{ME=await api('/me');await refresh();if(connection==='ready')await checkPending();else if(connection)toast(connection==='cancelled'?'Autorização cancelada na Meta.':'A Meta não confirmou a conexão. Confira as permissões e tente novamente.');}catch{ME=null;loginScreen();}})();
</script>
</body>
</html>
